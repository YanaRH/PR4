{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Получатели</h1>
    <a class="btn btn-success" href="{% url 'mailing:recipient_create' %}">+ Добавить</a>
</div>
<table class="table table-striped">
    <thead><tr><th>Email</th><th>Ф.И.О.</th><th>Комментарий</th><th></th></tr></thead>
    <tbody>
    {% for r in recipients %}
        <tr>
            <td>{{ r.email }}</td>
            <td>{{ r.full_name }}</td>
            <td>{{ r.comment }}</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" href="{% url 'mailing:recipient_update' r.pk %}">Ред.</a>
                <a class="btn btn-sm btn-outline-danger" href="{% url 'mailing:recipient_delete' r.pk %}">Удал.</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="4" class="text-center text-muted">Пока нет получателей</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
