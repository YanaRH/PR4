{% extends "base.html" %}
{% block content %}
<h1>{% if object %}Редактирование{% else %}Создание{% endif %}</h1>
<form method="post" class="mt-3" style="max-width: 600px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
