{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Сообщения</h1>
    <a class="btn btn-success" href="{% url 'mailing:message_create' %}">+ Добавить</a>
</div>
<table class="table table-striped">
    <thead><tr><th>Тема</th><th>Тело</th><th></th></tr></thead>
    <tbody>
    {% for m in messages_list %}
        <tr>
            <td>{{ m.subject }}</td>
            <td>{{ m.body|truncatechars:80 }}</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" href="{% url 'mailing:message_update' m.pk %}">Ред.</a>
                <a class="btn btn-sm btn-outline-danger" href="{% url 'mailing:message_delete' m.pk %}">Удал.</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3" class="text-center text-muted">Пока нет сообщений</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
