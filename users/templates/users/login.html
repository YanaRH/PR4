{% extends "base.html" %}
{% block content %}
<h1>Вход</h1>
<form method="post" class="mt-3" style="max-width: 400px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Войти</button>
</form>
<p class="mt-3"><a href="{% url 'users:password_reset' %}">Забыли пароль?</a></p>
<p><a href="{% url 'users:register' %}">Регистрация</a></p>
{% endblock %}
